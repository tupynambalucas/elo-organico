# =================================================================== #
# Elo Instance — Production Compose
# Runs: API + Web (Nginx) + Redis
# Does NOT include MongoDB — production uses MongoDB Atlas (cloud).
#
# Usage:
#   Production: docker compose -f instance/compose.prod.yaml --env-file instance/.env.prod up -d --build
#   Staging:    docker compose -f instance/compose.prod.yaml --env-file instance/.env.staging up -d --build
#
# The --env-file supplies ${VAR} interpolations in this YAML (e.g. VITE_TURNSTILE_SITE_KEY).
# Each service reads its own secrets from its own env_file (apps/api/.env.prod).
# =================================================================== #

name: elo-instance-prod

services:
  # ---------------------------------------------------------------- #
  # API — Fastify Node.js Server
  # Reads secrets from apps/api/.env.prod at runtime.
  # NOT exposed to the host — Nginx proxies all traffic internally.
  # ---------------------------------------------------------------- #
  api:
    build:
      context: ../
      dockerfile: instance/apps/api/Dockerfile
    image: elo-instance-api:latest
    container_name: elo-instance-api-${APP_ENV:-prod}
    restart: unless-stopped
    env_file:
      - apps/api/.env.${APP_ENV:-prod}
    expose:
      - '3000'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      network:
        aliases:
          - elo.instance.prod
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'const http = require("http"); const req = http.request("http://localhost:3000/health", (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on("error", () => process.exit(1)); req.end();',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------- #
  # Web — React SPA served by Nginx
  # Nginx also reverse-proxies /api/ to instance-api:3000.
  # VITE_* vars are baked into the JS bundle at build time via ARG.
  # ---------------------------------------------------------------- #
  web:
    build:
      context: ../
      dockerfile: instance/apps/web/Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    image: elo-instance-web:latest
    container_name: elo-instance-web-${APP_ENV:-prod}
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - network

  # ---------------------------------------------------------------- #
  # Redis — BullMQ message broker
  # Required by the API for async job processing.
  # ---------------------------------------------------------------- #
  redis:
    build:
      context: ./infrastructure/redis
      dockerfile: Dockerfile
    image: elo-instance-redis:latest
    container_name: elo-instance-redis-${APP_ENV:-prod}
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  network:
    name: elo_instance_network
    driver: bridge

volumes:
  redis-data:
    name: elo_instance_redis_prod_data
