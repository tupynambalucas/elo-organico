name: elo-instance

services:
  db:
    build:
      context: ./infrastructure/mongodb
      dockerfile: Dockerfile
    container_name: elo-instance-db
    restart: always
    ports:
      - '27017:27017'
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--keyFile', '/data/mongo-keyfile']
    env_file:
      - .env.dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo-data:/data/db
    networks:
      - network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-seed:
    build:
      context: ./infrastructure/mongodb
      dockerfile: Dockerfile
    container_name: elo-instance-db-seed
    # Overrides the entrypoint to run the seed script
    entrypoint: ['./seed.sh']
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
      ADMIN_USER_SEED: ${ADMIN_USER_SEED}
      ADMIN_EMAIL_SEED: ${ADMIN_EMAIL_SEED}
      ADMIN_PASS_SEED: ${ADMIN_PASS_SEED}
    networks:
      - network

  redis:
    build:
      context: ./infrastructure/redis
      dockerfile: Dockerfile
    container_name: elo-instance-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  network:
    name: elo_instance_network
    driver: bridge

volumes:
  mongo-data:
    name: elo_instance_mongo_data
  redis-data:
    name: elo_instance_redis_data
