name: elo-portal-dev

services:
  db:
    build:
      context: ./infrastructure/mongodb
      dockerfile: Dockerfile
    container_name: elo-portal-db-dev
    restart: always
    ports:
      - '27018:27017'
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--keyFile', '/data/mongo-keyfile']
    env_file:
      - .env.dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo-data:/data/db
    networks:
      - network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    build:
      context: ./infrastructure/mongodb
      dockerfile: Dockerfile
    container_name: elo-portal-db-init-dev
    # Single responsibility: initialize the MongoDB Replica Set (rs0).
    # Admin user seeding is handled by the API on startup (SeedPlugin).
    entrypoint: ['./seed.sh']
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    networks:
      - network

  redis:
    build:
      context: ./infrastructure/redis
      dockerfile: Dockerfile
    container_name: elo-portal-redis-dev
    restart: always
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    networks:
      - network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  network:
    name: elo_portal_network
    driver: bridge

volumes:
  mongo-data:
    name: elo_portal_mongo_data
  redis-data:
    name: elo_portal_redis_data
