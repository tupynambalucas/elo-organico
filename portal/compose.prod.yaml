# =================================================================== #
# Elo Portal — Production Compose
# Runs: API + Web (Nginx) + Redis
# Does NOT include MongoDB — production uses MongoDB Atlas (cloud).
#
# Usage:
#   Production: docker compose -f portal/compose.prod.yaml --env-file portal/.env.prod up -d --build
#   Staging:    docker compose -f portal/compose.prod.yaml --env-file portal/.env.staging up -d --build
# =================================================================== #

name: elo-portal-prod

services:
  # ---------------------------------------------------------------- #
  # API — Fastify Node.js Server
  # ---------------------------------------------------------------- #
  api:
    build:
      context: ../
      dockerfile: portal/apps/api/Dockerfile
    image: elo-portal-api:latest
    container_name: elo-portal-api
    restart: unless-stopped
    env_file:
      - apps/api/.env.${APP_ENV:-prod}
    expose:
      - '3001'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      network:
        aliases:
          - elo.portal.prod
    healthcheck:
      test: ['CMD', 'node', '-e', 'const http = require("http"); const req = http.request("http://localhost:3001/health", (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on("error", () => process.exit(1)); req.end();']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------- #
  # Web — React SPA served by Nginx
  # ---------------------------------------------------------------- #
  web:
    build:
      context: ../
      dockerfile: portal/apps/web/Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    image: elo-portal-web:latest
    container_name: elo-portal-web
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - network

  # ---------------------------------------------------------------- #
  # Redis — BullMQ message broker
  # ---------------------------------------------------------------- #
  redis:
    build:
      context: ./infrastructure/redis
      dockerfile: Dockerfile
    image: elo-portal-redis:latest
    container_name: elo-portal-redis-prod
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  network:
    name: elo_portal_network
    driver: bridge

volumes:
  redis-data:
    name: elo_portal_redis_prod_data
