# =================================================================== #
# Elo Portal — Production Compose
# Runs: API + Web (Nginx) + Redis
# Does NOT include MongoDB — production uses MongoDB Atlas (cloud).
#
# Usage:
#   Production: docker compose -f portal/compose.prod.yaml --env-file portal/.env.prod up -d --build
#   Staging:    docker compose -f portal/compose.prod.yaml --env-file portal/.env.staging up -d --build
# =================================================================== #

name: elo-portal-prod

services:
  # ---------------------------------------------------------------- #
  # API — Fastify Node.js Server
  # ---------------------------------------------------------------- #
  portal-api:
    build:
      context: ../
      dockerfile: portal/apps/api/Dockerfile
    image: elo-portal-api:latest
    container_name: elo-portal-api
    restart: unless-stopped
    env_file:
      - apps/api/.env.prod
    expose:
      - '3001'
    depends_on:
      portal-redis:
        condition: service_healthy
    networks:
      - elo-portal-network
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------- #
  # Web — React SPA served by Nginx
  # ---------------------------------------------------------------- #
  portal-web:
    build:
      context: ../
      dockerfile: portal/apps/web/Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    image: elo-portal-web:latest
    container_name: elo-portal-web
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      portal-api:
        condition: service_healthy
    networks:
      - elo-portal-network

  # ---------------------------------------------------------------- #
  # Redis — BullMQ message broker
  # ---------------------------------------------------------------- #
  portal-redis:
    build:
      context: ./infrastructure/redis
      dockerfile: Dockerfile
    image: elo-portal-redis:latest
    container_name: elo-portal-redis-prod
    restart: unless-stopped
    volumes:
      - elo-portal-redis-prod-data:/data
    networks:
      - elo-portal-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  elo-portal-network:
    driver: bridge

volumes:
  elo-portal-redis-prod-data:
