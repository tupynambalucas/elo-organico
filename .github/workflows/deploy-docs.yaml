name: Deploy Documentation

on:
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yaml'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Global Documents
        run: |
          pnpm docs:generate:changelog
          pnpm docs:generate:roadmap

      - name: Commit and Push Compiled Documents
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md ROADMAP.md
          if git diff --staged --quiet; then
            echo "No changes to CHANGELOG.md or ROADMAP.md"
          else
            git commit -m "docs: update root CHANGELOG.md and ROADMAP.md [skip ci]"
            git push
          fi

      - name: Build documentation
        run: pnpm docs:build
        env:
          BUCKET_URL: ${{ secrets.BUCKET_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/build --project-name=elo-organico-docs
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
