name: elo-agents

services:
  copilot:
    build:
      context: ./copilot
    container_name: agent-copilot
    restart: always
    environment:
      - COPILOT_HOME=/root/.copilot
    volumes:
      # Mount monorepo workspace as the active working directory
      - ../../:/workspace
      # Inject shared skills into the container workspace virtual .agents folder
      - ./skills:/workspace/.agents/skills
      # Inject unified MCP config into the workspace virtual .agents folder
      - ./mcp_config.json:/workspace/.agents/mcp_config.json
      # Persist Copilot session state, authentication tokens and configuration
      - ./copilot/data:/root/.copilot
      # Persist GitHub CLI credentials and extensions
      - ./copilot/gh-config:/root/.config/gh
      # Mount host SSH keys and Git identity for repository operations (read-only)
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
      # Mount host Docker socket for Docker-out-of-Docker orchestration
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    networks:
      - elo-mcp-net
    command: >
      bash -c "
      mkdir -p /root/.copilot &&
      cp /workspace/tools/agents/mcp_config.json /root/.copilot/mcp-config.json &&
      exec tail -f /dev/null
      "

  antigravity:
    build:
      context: ./antigravity
    container_name: agent-antigravity
    restart: always
    volumes:
      # Mount monorepo workspace as the active working directory
      - ../../:/workspace
      # Inject shared skills into the container workspace virtual .agents folder
      - ./skills:/workspace/.agents/skills
      # Inject unified MCP config into the workspace virtual .agents folder
      - ./mcp_config.json:/workspace/.agents/mcp_config.json
      # Persist dynamic runtime data: brain, conversations, histories, log buffers
      - ./antigravity/data:/root/.gemini/antigravity-cli
      # Mount host SSH keys and Git identity for repository operations (read-only)
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
      # Mount host Docker socket for Docker-out-of-Docker orchestration
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    networks:
      - elo-mcp-net
    command: >
      bash -c "
      mkdir -p /root/.gemini/antigravity-cli &&
      cp /workspace/tools/agents/antigravity/settings.json /root/.gemini/antigravity-cli/settings.json &&
      cp /workspace/tools/agents/antigravity/statusline.sh /root/.gemini/antigravity-cli/statusline.sh &&
      cp /workspace/tools/agents/antigravity/title.sh /root/.gemini/antigravity-cli/title.sh &&
      cp /workspace/tools/agents/antigravity/onboarding.json /root/.gemini/antigravity-cli/onboarding.json &&
      mkdir -p /root/.gemini/config &&
      cp /workspace/tools/agents/antigravity/config.json /root/.gemini/config/config.json &&
      exec tail -f /dev/null
      "

networks:
  # Attach to the network owned and declared by tools/mcp/compose.yaml
  # Prerequisite: pnpm mcp:up must be executed before pnpm agents:up
  elo-mcp-net:
    name: elo-mcp-net
    external: true
