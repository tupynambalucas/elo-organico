name: elo-agents-dev

networks:
  elo-agents-net:
    name: elo-agents-net-dev
    driver: bridge

services:
  copilot:
    build:
      context: ./infrastructure/copilot
    container_name: agent-copilot-dev
    restart: always
    env_file:
      - ./infrastructure/copilot/.env.${DOCKER_ENV:-dev}
    environment:
      - COPILOT_HOME=/root/.copilot
    volumes:
      # Mount monorepo workspace as the active working directory
      - ../../:/workspace
      # Mask the workspace-level .agents folder to prevent loading host configurations
      - /workspace/.agents
      # Inject shared skills into the container workspace virtual .agents folder
      - ./skills:/workspace/.agents/skills
      # Persist Copilot session state, authentication tokens and configuration
      - ./data/copilot:/root/.copilot
      # Persist GitHub CLI credentials and extensions
      - ./data/copilot/gh-config:/root/.config/gh
      # Mount host SSH keys and Git identity for repository operations (read-only)
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
      # Mount host Docker socket for Docker-out-of-Docker orchestration
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    networks:
      - elo-agents-net
    extra_hosts:
      - 'elo.internal.tools.mcp:host-gateway'
    command: >
      bash -c "
      mkdir -p /root/.copilot &&
      cp /workspace/tools/agents/shared/mcp.config.json /root/.copilot/mcp-config.json &&
      exec tail -f /dev/null
      "

  antigravity:
    build:
      context: ./infrastructure/antigravity
    container_name: agent-antigravity-dev
    restart: always
    env_file:
      - ./infrastructure/antigravity/.env.${DOCKER_ENV:-dev}
    volumes:
      # Mount monorepo workspace as the active working directory
      - ../../:/workspace
      # Mask the workspace-level .agents folder to prevent loading host configurations
      - /workspace/.agents
      # Inject shared skills into the container workspace virtual .agents folder
      - ./skills:/workspace/.agents/skills
      # Persist dynamic runtime data: brain, conversations, histories, log buffers
      - ./data/antigravity:/root/.gemini
      # Mount host SSH keys and Git identity for repository operations (read-only)
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
      # Mount host Docker socket for Docker-out-of-Docker orchestration
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    networks:
      - elo-agents-net
    extra_hosts:
      - 'elo.internal.tools.mcp:host-gateway'
    command: >
      bash -c "
      mkdir -p /root/.gemini/config &&
      cp /workspace/tools/agents/shared/mcp.config.json /root/.gemini/config/mcp_config.json &&
      exec tail -f /dev/null
      "
