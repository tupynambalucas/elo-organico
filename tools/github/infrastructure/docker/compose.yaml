name: elo-github

services:
  # Service 1: One-shot execution to push secrets to the repository and shut down
  gh-secrets:
    build:
      context: ../../services/gh
      dockerfile: Dockerfile
    container_name: github-gh-secrets
    volumes:
      - ../../:/workspace
    env_file:
      - ../../services/gh/.env.gh.example
    environment:
      - GH_TOKEN=${GH_TOKEN}
      - SECRETS_DIR=/workspace/config/security
      - LOG_DIR=/workspace/logs/scripts
    working_dir: /workspace
    command: ['/workspace/services/gh/src/sync_repo_secrets_variables.sh']

  # Service 2: Long-running interactive GitHub CLI service for docker exec use
  gh:
    build:
      context: ../../services/gh
      dockerfile: Dockerfile
    container_name: github-gh-cli
    volumes:
      - ../../:/workspace
    env_file:
      - ../../services/gh/.env.gh.example
    working_dir: /workspace
    tty: true
    stdin_open: true
    command: ['-c', 'tail -f /dev/null']

  # Service 3: Long-running git-only container for commits and local git operations
  git:
    build:
      context: ../../services/git
      dockerfile: Dockerfile
    container_name: github-git-bash
    volumes:
      - ../../../../:/workspace
    env_file:
      - ../../services/git/.env.git.example
    environment:
      - GH_TOKEN=${GH_TOKEN}
      # Configure Git to automatically authenticate HTTPS requests to github.com using the GH_TOKEN
      - GIT_CONFIG_COUNT=2
      - GIT_CONFIG_KEY_0=credential.https://github.com.username
      - GIT_CONFIG_VALUE_0=x-access-token
      - GIT_CONFIG_KEY_1=credential.https://github.com.helper
      - GIT_CONFIG_VALUE_1=!f() { test "$1" = get && echo "password=${GH_TOKEN}"; }; f
      - EDITOR=${EDITOR:-nano}
      - PAGER=${PAGER:-less}
    working_dir: /workspace
    tty: true
    stdin_open: true
    command: ['-c', 'tail -f /dev/null']


