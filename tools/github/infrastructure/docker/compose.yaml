name: elo-github

services:
  # Service 1: One-shot execution to push secrets to the repository and shut down
  gh-secrets:
    build:
      context: ../../services/gh
      dockerfile: Dockerfile
    container_name: github-gh-secrets
    volumes:
      - ../../:/workspace
    env_file:
      - ../../services/gh/.env.gh.example
    environment:
      - GH_TOKEN=${GH_TOKEN}
    working_dir: /workspace
    command: ['/workspace/services/gh/src/sync_repo_secrets_variables.sh']

  # Service 2: Long-running interactive GitHub CLI service for docker exec use
  gh:
    build:
      context: ../../services/gh
      dockerfile: Dockerfile
    container_name: github-gh-cli
    volumes:
      - ../../:/workspace
    env_file:
      - ../../services/gh/.env.gh
    working_dir: /workspace
    tty: true
    stdin_open: true
    command: ['-c', 'tail -f /dev/null']

  # Service 3: Long-running git-only container for commits and local git operations
  git:
    build:
      context: ../../services/git
      dockerfile: Dockerfile
    container_name: github-git-bash
    volumes:
      - ../../../../:/workspace
    env_file:
      - ../../services/git/.env.git
    working_dir: /workspace
    tty: true
    stdin_open: true
    command: ['-c', 'tail -f /dev/null']


