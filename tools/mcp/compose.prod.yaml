name: elo-mcp-${DOCKER_ENV:-prod}

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: elo-mcp-gateway-${DOCKER_ENV:-prod}
    restart: unless-stopped
    ports:
      - '3005:3000'
    networks:
      elo-mcp-net:
        aliases:
          - elo.internal.tools
    depends_on:
      - github
      - context7
      - browser
      - dockerhub

  github:
    build:
      context: .
      dockerfile: infrastructure/github/Dockerfile
    container_name: elo-mcp-github-${DOCKER_ENV:-prod}
    restart: unless-stopped
    env_file:
      - ./infrastructure/github/.env.${DOCKER_ENV:-prod}
    volumes:
      - ./infrastructure/github/instructions.md:/app/instructions.md:ro
    networks:
      - elo-mcp-net

  context7:
    build:
      context: .
      dockerfile: infrastructure/context7/Dockerfile
    container_name: elo-mcp-context7-${DOCKER_ENV:-prod}
    restart: unless-stopped
    env_file:
      - ./infrastructure/context7/.env.${DOCKER_ENV:-prod}
    volumes:
      - ./infrastructure/context7/instructions.md:/app/instructions.md:ro
    networks:
      - elo-mcp-net

  browser:
    build:
      context: .
      dockerfile: infrastructure/browser/Dockerfile
    container_name: elo-mcp-browser-${DOCKER_ENV:-prod}
    restart: unless-stopped
    env_file:
      - ./infrastructure/browser/.env.${DOCKER_ENV:-prod}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'elo.internal:host-gateway'
    shm_size: '2gb'
    volumes:
      - ./infrastructure/browser/instructions.md:/app/instructions.md:ro
    networks:
      - elo-mcp-net

  dockerhub:
    build:
      context: .
      dockerfile: infrastructure/dockerhub/Dockerfile
    container_name: elo-mcp-dockerhub-${DOCKER_ENV:-prod}
    restart: unless-stopped
    env_file:
      - ./infrastructure/dockerhub/.env.${DOCKER_ENV:-prod}
    volumes:
      - ./infrastructure/dockerhub/instructions.md:/app/instructions.md:ro
    networks:
      - elo-mcp-net

networks:
  elo-mcp-net:
    name: elo-mcp-net-${DOCKER_ENV:-prod}
    driver: bridge
