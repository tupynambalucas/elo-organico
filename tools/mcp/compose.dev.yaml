name: elo-mcp-dev

networks:
  elo-mcp-net:
    name: elo-mcp-net-dev
    driver: bridge

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: elo-mcp-gateway-dev
    restart: always
    environment:
      - PORT=3005
    ports:
      - '3005:3005'
    networks:
      elo-mcp-net:
        aliases:
          - elo.internal.tools.mcp
    depends_on:
      - github
      - context7
      - browser
      - dockerhub

  github:
    build:
      context: .
      dockerfile: infrastructure/github/Dockerfile
    container_name: elo-mcp-github-dev
    restart: always
    env_file:
      - ./infrastructure/github/.env.${DOCKER_ENV:-dev}
    volumes:
      - ./infrastructure/github/instructions.md:/app/instructions.md:ro
    networks:
      - elo-mcp-net

  context7:
    build:
      context: .
      dockerfile: infrastructure/context7/Dockerfile
    container_name: elo-mcp-context7-dev
    restart: always
    env_file:
      - ./infrastructure/context7/.env.${DOCKER_ENV:-dev}
    volumes:
      - ./infrastructure/context7/instructions.md:/app/instructions.md:ro
    networks:
      - elo-mcp-net

  browser:
    build:
      context: .
      dockerfile: infrastructure/browser/Dockerfile
    container_name: elo-mcp-browser-dev
    restart: always
    env_file:
      - ./infrastructure/browser/.env.${DOCKER_ENV:-dev}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'elo.internal:host-gateway'
    shm_size: '2gb'
    volumes:
      - ./infrastructure/browser/instructions.md:/app/instructions.md:ro
    networks:
      - elo-mcp-net

  dockerhub:
    build:
      context: .
      dockerfile: infrastructure/dockerhub/Dockerfile
    container_name: elo-mcp-dockerhub-dev
    restart: always
    env_file:
      - ./infrastructure/dockerhub/.env.${DOCKER_ENV:-dev}
    volumes:
      - ./infrastructure/dockerhub/instructions.md:/app/instructions.md:ro
    networks:
      - elo-mcp-net
