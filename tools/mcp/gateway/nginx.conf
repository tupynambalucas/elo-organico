user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Gzip settings - disable gzip for Server-Sent Events (SSE) to prevent buffering
    gzip off;

    server {
        listen 80 default_server;
        server_name elo.internal.tools localhost;

        # Shared SSE and HTTP Proxy Configuration Template
        # SSE requires buffering and caching to be disabled, and connection to be kept alive.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and caching for SSE streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Increase timeouts for long-running connections (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # GitHub MCP Server SSE routes
        location /github/ {
            proxy_pass http://elo-mcp-github:3001/;
        }

        # Context7 MCP Server SSE routes
        location /context7/ {
            proxy_pass http://elo-mcp-context7:3002/;
        }

        # Playwright Browser MCP Server SSE routes
        location /browser/ {
            proxy_pass http://elo-mcp-browser:3003/;
        }

        # Docker Hub MCP Server SSE routes
        location /dockerhub/ {
            proxy_pass http://elo-mcp-dockerhub:3004/;
        }

        # Healthcheck endpoint
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"elo.internal.tools"}';
        }
    }
}
