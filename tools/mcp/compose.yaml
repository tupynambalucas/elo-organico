name: elo-mcp

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: elo-mcp-gateway
    restart: always
    ports:
      - "3005:3000"
    networks:
      elo-mcp-net:
        aliases:
          - elo.internal.tools
    depends_on:
      - github
      - context7
      - browser
      - dockerhub

  github:
    build:
      context: .
      dockerfile: infrastructure/github/Dockerfile
    container_name: elo-mcp-github
    restart: always
    env_file:
      - ./config/.env.github
    networks:
      - elo-mcp-net

  context7:
    build:
      context: .
      dockerfile: infrastructure/context7/Dockerfile
    container_name: elo-mcp-context7
    restart: always
    env_file:
      - ./config/.env.context7
    networks:
      - elo-mcp-net

  browser:
    build:
      context: .
      dockerfile: infrastructure/browser/Dockerfile
    container_name: elo-mcp-browser
    restart: always
    env_file:
      - ./config/.env.browser
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'elo.internal:host-gateway'
    shm_size: '2gb'
    networks:
      - elo-mcp-net

  dockerhub:
    build:
      context: .
      dockerfile: infrastructure/dockerhub/Dockerfile
    container_name: elo-mcp-dockerhub
    restart: always
    env_file:
      - ./config/.env.dockerhub
    networks:
      - elo-mcp-net

networks:
  elo-mcp-net:
    name: elo-mcp-net
    driver: bridge
